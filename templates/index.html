{% extends 'base.html' %}
{% block content %}
<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px;">
    {% for g in giveaways %}
    <div style="background: #151822; border: 1px solid #232736; border-radius: 10px; padding: 15px;">
        <span class="badge {% if g.status == '진행중' %}bg-active{% else %}bg-closed{% endif %}">{{ g.status }}</span>
        <h3 style="margin: 10px 0;">{{ g.title }}</h3>
        <p style="color: #8b92a5; font-size: 13px;">태그: {{ g.member_tag }} | 방식: {{ g.giveaway_type }}</p>
        <p style="color: #8b92a5; font-size: 13px;">마감일: {{ g.end_date.strftime('%Y-%m-%d %H:%M') }}</p>
        <a href="/giveaway/{{ g.id }}" class="btn" style="display:block; text-align:center; margin-top:10px;">상세보기 / 신청하기</a>
    </div>
    {% endfor %}
</div>
{% endblock %}
