{% if session.get('user_id') == giveaway.giver_id and giveaway.status == '진행중' %}
<form action="/giveaway/{{ giveaway.id }}/edit_conditions" method="POST" class="border p-3 rounded mb-4">
  <h5>나눔 조건 변경</h5>
  <div class="mb-2">
    <label>팔로우/구독 개월 수</label>
    <input type="number" name="min_months" value="{{ giveaway.min_months }}" min="1" class="form-control">
  </div>
  <div class="mb-2">
    <label>주접글 조건</label>
    <select name="require_comment" class="form-select">
      <option value="true" {% if giveaway.require_comment %}selected{% endif %}>쓴다</option>
      <option value="false" {% if not giveaway.require_comment %}selected{% endif %}>안 쓴다</option>
    </select>
  </div>
  <button type="submit" class="btn btn-warning btn-sm">조건 수정하기</button>
</form>
{% endif %}
