<form action="/giveaway/{{ giveaway.id }}/apply" method="POST" enctype="multipart/form-data">
  <!-- X 닉네임 입력 (필수) -->
  <div class="mb-3">
    <label class="form-label">본인 X(트위터) 닉네임/아이디</label>
    <input type="text" name="x_nickname" class="form-control" placeholder="@username 또는 닉네임" required>
  </div>

  <!-- 주접글 조건이 '쓴다'일 때만 표시 -->
  {% if giveaway.require_comment %}
  <div class="mb-3">
    <label class="form-label">주접글 작성</label>
    <textarea name="comment" class="form-control" rows="3" required placeholder="응원의 한마디를 남겨주세요!"></textarea>
  </div>
  {% endif %}

  <button type="submit" class="btn btn-primary">신청하기</button>
</form>
