<!-- 팔로우/구독 개월 수 (필수) -->
<div class="mb-3">
  <label class="form-label">최소 팔로우/구독 기간 (개월)</label>
  <input type="number" name="min_months" class="form-control" value="1" min="1" required>
</div>

<!-- 주접글 여부 선택 -->
<div class="mb-3">
  <label class="form-label">주접글 작성 조건</label>
  <div>
    <input type="radio" name="require_comment" value="true" id="comment_yes">
    <label for="comment_yes">쓴다</label>
    
    <input type="radio" name="require_comment" value="false" id="comment_no" checked>
    <label for="comment_no">안 쓴다</label>
  </div>
</div>
